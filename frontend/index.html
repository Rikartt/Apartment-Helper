<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGPendler</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Courier New', Courier, monospace; background: #1a1a1a; color: #e0e0e0; display: flex; flex-direction: column; height: 100vh; }

  #topbar {
    background: #111; border-bottom: 2px solid #c00; padding: 8px 16px;
    display: flex; align-items: center; gap: 16px; flex-shrink: 0;
  }
  #topbar h1 { color: #c00; font-size: 1.1rem; letter-spacing: 0.15em; text-transform: uppercase; }
  #count { color: #888; font-size: 0.75rem; margin-left: auto; }
  .topbar-btn {
    background: none; border: 1px solid #333; color: #aaa;
    font-family: inherit; font-size: 0.7rem; padding: 3px 10px;
    cursor: pointer; letter-spacing: 0.08em;
  }
  .topbar-btn:hover { border-color: #c00; color: #e0e0e0; }

  #filters {
    background: #111; border-bottom: 1px solid #333; padding: 8px 16px;
    display: flex; gap: 24px; align-items: center; flex-wrap: wrap; flex-shrink: 0;
  }
  .filter-group { display: flex; align-items: center; gap: 8px; }
  .filter-group label { font-size: 0.7rem; color: #888; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }
  .filter-group input[type=range] { accent-color: #c00; width: 110px; }
  .filter-val { font-size: 0.8rem; color: #e0e0e0; font-variant-numeric: tabular-nums; min-width: 60px; }

  .campus-toggle { display: flex; gap: 0; }
  .campus-toggle button {
    background: #1a1a1a; color: #888; border: 1px solid #333;
    font-family: inherit; font-size: 0.7rem; padding: 3px 8px; cursor: pointer;
    letter-spacing: 0.05em;
  }
  .campus-toggle button:first-child { border-radius: 2px 0 0 2px; }
  .campus-toggle button:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
  .campus-toggle button.active { background: #c00; color: #fff; border-color: #c00; }

  .mode-toggle { display: flex; gap: 0; }
  .mode-toggle button {
    background: #1a1a1a; color: #888; border: 1px solid #333;
    font-family: inherit; font-size: 0.7rem; padding: 3px 8px; cursor: pointer;
  }
  .mode-toggle button:first-child { border-radius: 2px 0 0 2px; }
  .mode-toggle button:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
  .mode-toggle button.active { background: #2196f3; color: #fff; border-color: #2196f3; }

  .poster-toggle { display: flex; gap: 0; }
  .poster-toggle button {
    background: #1a1a1a; color: #888; border: 1px solid #333;
    font-family: inherit; font-size: 0.7rem; padding: 3px 8px; cursor: pointer;
  }
  .poster-toggle button:first-child { border-radius: 2px 0 0 2px; }
  .poster-toggle button:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
  .poster-toggle button:not(:first-child) { border-left: none; }
  .poster-toggle button.active { background: #00695c; color: #fff; border-color: #00695c; }

  .sort-toggle { display: flex; gap: 0; }
  .sort-toggle button {
    background: #1a1a1a; color: #888; border: 1px solid #333;
    font-family: inherit; font-size: 0.7rem; padding: 3px 8px; cursor: pointer;
  }
  .sort-toggle button:first-child { border-radius: 2px 0 0 2px; }
  .sort-toggle button:last-child  { border-radius: 0 2px 2px 0; border-left: none; }
  .sort-toggle button:not(:first-child) { border-left: none; }
  .sort-toggle button.active { background: #7b1fa2; color: #fff; border-color: #7b1fa2; }

  #main { display: flex; flex: 1; overflow: hidden; }
  #map { flex: 1; }

  #sidebar {
    width: 300px; background: #111; border-left: 1px solid #333;
    overflow-y: auto; display: flex; flex-direction: column; flex-shrink: 0;
  }
  #sidebar-header {
    padding: 6px 12px; border-bottom: 1px solid #333;
    font-size: 0.65rem; color: #555; letter-spacing: 0.1em; text-transform: uppercase;
    flex-shrink: 0;
  }

  .card {
    padding: 9px 12px; border-bottom: 1px solid #1e1e1e; cursor: pointer;
    transition: background 0.1s; position: relative;
  }
  .card:hover { background: #181818; }
  .card.selected { background: #1c1c1c; border-left: 3px solid #c00; padding-left: 9px; }
  .card-rent { font-size: 1.05rem; color: #c00; font-variant-numeric: tabular-nums; display: inline-block; }
  .card-score  { display: inline-block; margin-left: 8px; font-size: 0.7rem; font-weight: bold; padding: 1px 5px; border-radius: 2px; font-variant-numeric: tabular-nums; vertical-align: middle; }
  .score-high  { background: #1a3a1a; color: #4caf50; }
  .score-mid   { background: #1a2a3a; color: #2196f3; }
  .score-low   { background: #2a2a1a; color: #888; }
  .card-reply  { display: inline-block; margin-left: 4px; font-size: 0.7rem; padding: 1px 5px; border-radius: 2px; font-variant-numeric: tabular-nums; vertical-align: middle; }
  .reply-high  { background: #241a00; color: #ffc107; }
  .reply-mid   { background: #1e1400; color: #a07820; }
  .reply-low   { background: #1e1a1a; color: #555; }
  .card-title { font-size: 0.75rem; color: #ccc; margin-top: 1px; }
  .card-address { font-size: 0.65rem; color: #666; margin-top: 1px; }
  .card-commute { font-size: 0.65rem; color: #4a9; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .card-meta { font-size: 0.6rem; color: #444; margin-top: 3px; display: flex; justify-content: space-between; align-items: center; }
  .card-link {
    font-size: 0.6rem; color: #2196f3; text-decoration: none; letter-spacing: 0.05em;
  }
  .card-link:hover { text-decoration: underline; }

  /* profile panel */
  #profile-panel {
    position: fixed; top: 0; right: 0; width: 380px; height: 100vh;
    background: #111; border-left: 1px solid #333; z-index: 1000;
    display: flex; flex-direction: column; transform: translateX(100%);
    transition: transform 0.2s ease;
  }
  #profile-panel.open { transform: translateX(0); }
  #profile-panel-header {
    padding: 12px 16px; border-bottom: 2px solid #c00;
    display: flex; justify-content: space-between; align-items: center;
  }
  #profile-panel-header h2 { color: #c00; font-size: 0.85rem; letter-spacing: 0.1em; text-transform: uppercase; }
  #profile-panel-body { flex: 1; overflow-y: auto; padding: 12px 16px; }
  #profile-panel-footer { padding: 12px 16px; border-top: 1px solid #333; display: flex; gap: 8px; }

  .pfield { margin-bottom: 12px; }
  .pfield label { display: block; font-size: 0.65rem; color: #888; letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 3px; }
  .pfield input, .pfield textarea {
    width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0;
    font-family: inherit; font-size: 0.75rem; padding: 5px 8px; outline: none;
  }
  .pfield input:focus, .pfield textarea:focus { border-color: #c00; }
  .pfield textarea { resize: vertical; min-height: 60px; }
  .pfield .hint { font-size: 0.6rem; color: #555; margin-top: 2px; }

  .save-btn {
    flex: 1; background: #c00; color: #fff; border: none; font-family: inherit;
    font-size: 0.75rem; padding: 7px; cursor: pointer; letter-spacing: 0.08em;
  }
  .save-btn:hover { background: #e00; }
  .cancel-btn {
    background: none; border: 1px solid #333; color: #888; font-family: inherit;
    font-size: 0.75rem; padding: 7px 14px; cursor: pointer;
  }
  .cancel-btn:hover { border-color: #666; }
  .saved-msg { font-size: 0.65rem; color: #4caf50; align-self: center; display: none; }

  /* ── listing detail view ───────────────────────────────────────── */
  #detail-view { display:none; flex-direction:column; height:100%; }
  #detail-view.open { display:flex; }
  #detail-topbar {
    padding: 6px 12px; border-bottom: 1px solid #333; flex-shrink:0;
    display:flex; justify-content:space-between; align-items:center;
  }
  .detail-back {
    background:none; border:none; color:#888; font-family:inherit;
    font-size:0.7rem; cursor:pointer; padding:2px 0; letter-spacing:0.05em;
  }
  .detail-back:hover { color:#e0e0e0; }
  #detail-body { flex:1; overflow-y:auto; padding:12px; }
  .detail-rent { font-size:1.4rem; color:#c00; font-variant-numeric:tabular-nums; }
  .detail-title { font-size:0.8rem; color:#ccc; margin:2px 0; }
  .detail-addr  { font-size:0.65rem; color:#666; }
  .detail-commute { font-size:0.7rem; color:#4a9; margin:6px 0; }
  .detail-section { margin-top:10px; }
  .detail-section-label {
    font-size:0.6rem; color:#555; letter-spacing:0.1em; text-transform:uppercase;
    margin-bottom:4px; border-top:1px solid #1e1e1e; padding-top:8px;
  }
  .pill {
    display:inline-block; background:#1e1e1e; color:#aaa; border:1px solid #2a2a2a;
    border-radius:2px; font-size:0.65rem; padding:1px 6px; margin:2px 2px 0 0;
  }
  .pill.red   { background:#2a0000; color:#e57373; border-color:#5a1010; }
  .pill.green { background:#0a2010; color:#66bb6a; border-color:#1a4a20; }
  .detail-bullet { font-size:0.7rem; color:#aaa; margin:2px 0; padding-left:8px; }
  .detail-bullet::before { content:"• "; color:#555; }
  .detail-link-btn {
    display:block; margin-top:14px; text-align:center; background:#c00; color:#fff;
    font-family:inherit; font-size:0.75rem; padding:7px; text-decoration:none;
    letter-spacing:0.08em;
  }
  .detail-link-btn:hover { background:#e00; }
  .detail-scores { margin:6px 0; }

  /* ── best listings modal ──────────────────────────────────────── */
  #best-modal {
    display:none; position:fixed; inset:0; background:#0009; z-index:2000;
    align-items:center; justify-content:center;
  }
  #best-modal.open { display:flex; }
  #best-box {
    background:#111; border:1px solid #333; width:min(700px, 95vw);
    max-height:90vh; display:flex; flex-direction:column; border-top:2px solid #c00;
  }
  #best-header {
    padding:10px 16px; border-bottom:1px solid #333;
    display:flex; justify-content:space-between; align-items:center; flex-shrink:0;
  }
  #best-header h2 { color:#c00; font-size:0.85rem; letter-spacing:0.1em; text-transform:uppercase; }
  #best-list { overflow-y:auto; flex:1; }
  .best-entry {
    padding:12px 16px; border-bottom:1px solid #1e1e1e;
  }
  .best-entry-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:4px; }
  .best-entry-title { font-size:0.8rem; color:#ccc; }
  .best-entry-rent { font-size:1rem; color:#c00; font-variant-numeric:tabular-nums; }
  .best-sw { display:flex; gap:16px; margin-top:6px; flex-wrap:wrap; }
  .best-col-label { font-size:0.6rem; color:#555; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:3px; }
  .best-col { min-width:140px; flex:1; }
  .best-strength { font-size:0.7rem; color:#66bb6a; margin:1px 0; }
  .best-strength::before { content:"✓ "; }
  .best-weakness { font-size:0.7rem; color:#e57373; margin:1px 0; }
  .best-weakness::before { content:"✗ "; }
  .best-tip { margin-top:6px; font-size:0.68rem; color:#ffc107; }
  .best-tip::before { content:"💡 "; }
  .best-open { font-size:0.65rem; color:#2196f3; text-decoration:none; }
  .best-open:hover { text-decoration:underline; }
  #best-loading { padding:32px; text-align:center; color:#555; font-size:0.8rem; letter-spacing:0.1em; }

  /* popup overrides */
  .leaflet-popup-content-wrapper { background: #111; border: 1px solid #333; border-radius: 2px; }
  .leaflet-popup-content { color: #e0e0e0; font-family: 'Courier New', monospace; font-size: 12px; margin: 8px 10px; }
  .leaflet-popup-tip { background: #111; }
  .popup-rent { color: #c00; font-size: 1rem; font-variant-numeric: tabular-nums; }
  .popup-commute { color: #4a9; font-size: 0.7rem; margin-top: 4px; }
  .popup-link { color: #2196f3; font-size: 0.7rem; display: block; margin-top: 4px; }
</style>
</head>
<body>

<div id="topbar">
  <h1>WGPendler</h1>
  <span id="count">— listings</span>
  <button class="topbar-btn" onclick="runExtract()" id="extract-btn">Extract</button>
  <button class="topbar-btn" onclick="showBest()" style="border-color:#ffc107;color:#ffc107">Top 5</button>
  <button class="topbar-btn" onclick="openProfile()">Profile</button>
</div>

<div id="profile-panel">
  <div id="profile-panel-header">
    <h2>My Profile</h2>
    <button class="cancel-btn" onclick="closeProfile()">✕</button>
  </div>
  <div id="profile-panel-body">
    <div class="pfield">
      <label>Status</label>
      <input type="text" id="p-status">
    </div>
    <div class="pfield">
      <label>Move-in (earliest)</label>
      <input type="date" id="p-move-in">
    </div>
    <div class="pfield">
      <label>Max Budget (CHF/month)</label>
      <input type="number" id="p-budget-max" min="0" max="5000">
    </div>
    <div class="pfield">
      <label>Age</label>
      <input type="number" id="p-age" min="16" max="99">
    </div>
    <div class="pfield">
      <label>Gender</label>
      <input type="text" id="p-gender" placeholder="e.g. male / female / non-binary">
    </div>
    <div class="pfield">
      <label>Smoker</label>
      <input type="text" id="p-smoker" placeholder="yes / no">
    </div>
    <div class="pfield">
      <label>Languages <span class="hint">(one per line: German native)</span></label>
      <textarea id="p-languages" rows="3"></textarea>
    </div>
    <div class="pfield">
      <label>Traits <span class="hint">(one per line)</span></label>
      <textarea id="p-traits" rows="4"></textarea>
    </div>
    <div class="pfield">
      <label>Wants <span class="hint">(one per line)</span></label>
      <textarea id="p-wants" rows="3"></textarea>
    </div>
    <div class="pfield">
      <label>Message Template <span class="hint">Your personal intro — Claude fills in the ad-specific parts around this</span></label>
      <textarea id="p-template" rows="6" placeholder="e.g. I'm Rikard, 18, starting an MSc in EE at ETH in September. I'm tidy, non-smoking, quiet during the week and social on weekends. I cook regularly and go to the gym most days. I have stable funding and can provide references."></textarea>
    </div>
  </div>
  <div id="profile-panel-footer">
    <button class="cancel-btn" onclick="closeProfile()">Cancel</button>
    <button class="save-btn" onclick="saveProfile()">Save &amp; Re-score</button>
    <span class="saved-msg" id="saved-msg">Saved ✓</span>
  </div>
</div>

<div id="filters">
  <div class="filter-group">
    <label>Max Rent</label>
    <input type="range" id="maxRent" min="400" max="1500" step="50" value="1000">
    <span class="filter-val" id="rentLabel">1000 CHF</span>
  </div>

  <div class="filter-group">
    <label>Max Commute</label>
    <input type="range" id="maxCommute" min="5" max="60" step="5" value="60">
    <span class="filter-val" id="commuteLabel">any</span>
  </div>

  <div class="filter-group">
    <label>Posted by</label>
    <div class="poster-toggle">
      <button id="btn-poster-all" class="active" onclick="setPoster('all')">All</button>
      <button id="btn-poster-private" onclick="setPoster('private')">Private</button>
      <button id="btn-poster-agency" onclick="setPoster('agency')">Agency</button>
    </div>
  </div>

  <div class="filter-group">
    <label>Campus</label>
    <div class="campus-toggle">
      <button id="btn-zentrum" class="active" onclick="setCampus('zentrum')">Zentrum</button>
      <button id="btn-hoenggerberg" onclick="setCampus('hoenggerberg')">Hönggerberg</button>
    </div>
  </div>

  <div class="filter-group">
    <label>Mode</label>
    <div class="mode-toggle">
      <button id="btn-transit" class="active" onclick="setMode('transit')">Transit</button>
      <button id="btn-bike" onclick="setMode('bike')">Bike</button>
    </div>
  </div>

  <div class="filter-group">
    <label>Sort</label>
    <div class="sort-toggle">
      <button id="btn-sort-relevance" class="active" onclick="setSort('relevance')">Relevance</button>
      <button id="btn-sort-match" onclick="setSort('match')">Match</button>
      <button id="btn-sort-reply" onclick="setSort('reply')">Reply %</button>
    </div>
  </div>
</div>

<div id="main">
  <div id="map"></div>
  <div id="sidebar">
    <div id="cards-view">
      <div id="sidebar-header">LISTINGS</div>
      <div id="cards"></div>
    </div>
    <div id="detail-view">
      <div id="detail-topbar">
        <button class="detail-back" onclick="closeDetail()">← Listings</button>
        <a id="detail-ext-link" href="#" target="_blank" class="card-link">↗ open</a>
      </div>
      <div id="detail-body"></div>
    </div>
  </div>
</div>

<!-- best listings modal -->
<div id="best-modal">
  <div id="best-box">
    <div id="best-header">
      <h2>Top 5 Picks</h2>
      <button class="cancel-btn" onclick="closeBest()">✕</button>
    </div>
    <div id="best-list">
      <div id="best-loading">Analyzing listings…</div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ETH_ZENTRUM      = [47.3769, 8.5481];
const ETH_HOENGGERBERG = [47.4083, 8.5075];

const map = L.map('map').setView([47.388, 8.527], 13);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: '&copy; Esri &mdash; Esri, DeLorme, NAVTEQ', maxZoom: 16
}).addTo(map);

function ethMarker(pos, label) {
  const icon = L.divIcon({
    className: '',
    html: `<div style="background:#c00;border:2px solid #fff;border-radius:50%;width:12px;height:12px"></div>`,
    iconSize: [12, 12], iconAnchor: [6, 6]
  });
  L.marker(pos, { icon }).addTo(map).bindTooltip(label, { permanent: false });
}
ethMarker(ETH_ZENTRUM,      'ETH Zentrum');
ethMarker(ETH_HOENGGERBERG, 'ETH Hönggerberg');

let allListings = [];
let markers = {};
let campus       = 'zentrum';
let mode         = 'transit';
let sortMode     = 'relevance';
let posterFilter = 'all';

function setCampus(c) {
  campus = c;
  document.getElementById('btn-zentrum').classList.toggle('active', c === 'zentrum');
  document.getElementById('btn-hoenggerberg').classList.toggle('active', c === 'hoenggerberg');
  applyFilters();
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-transit').classList.toggle('active', m === 'transit');
  document.getElementById('btn-bike').classList.toggle('active', m === 'bike');
  applyFilters();
}

function setPoster(p) {
  posterFilter = p;
  document.getElementById('btn-poster-all').classList.toggle('active', p === 'all');
  document.getElementById('btn-poster-private').classList.toggle('active', p === 'private');
  document.getElementById('btn-poster-agency').classList.toggle('active', p === 'agency');
  applyFilters();
}

function setSort(s) {
  sortMode = s;
  document.getElementById('btn-sort-relevance').classList.toggle('active', s === 'relevance');
  document.getElementById('btn-sort-match').classList.toggle('active', s === 'match');
  document.getElementById('btn-sort-reply').classList.toggle('active', s === 'reply');
  applyFilters();
}

function relevanceScore(l) {
  const fit   = l.fit_score   ?? 0;
  const reply = l.reply_score ?? 0;
  return Math.round((fit + reply) / 2);
}

function commuteMin(l) {
  const key = `${mode}_${campus}_min`;
  return l[key] ?? 999;
}

function commuteLabel(l) {
  const t = l[`transit_${campus}_min`];
  const b = l[`bike_${campus}_min`];
  const campus_label = campus === 'zentrum' ? 'Zentrum' : 'Hönggerberg';
  const parts = [];
  if (t != null) parts.push(`🚋 ${t} min`);
  if (b != null) parts.push(`🚴 ${b} min`);
  return parts.length ? `${campus_label}: ${parts.join('  ')}` : '';
}

function rentColor(rent) {
  if (rent <= 800)  return '#4caf50';
  if (rent <= 1000) return '#2196f3';
  return '#ff9800';
}

function scoreChip(score) {
  if (score == null) return '';
  const cls = score >= 70 ? 'score-high' : score >= 50 ? 'score-mid' : 'score-low';
  return `<span class="card-score ${cls}" title="Match score">${score}</span>`;
}

function replyChip(score) {
  if (score == null) return '';
  const cls = score >= 60 ? 'reply-high' : score >= 35 ? 'reply-mid' : 'reply-low';
  return `<span class="card-reply ${cls}" title="Reply likelihood">${score}%</span>`;
}

function renderAll(listings) {
  listings = [...listings].sort((a, b) => {
    let sa, sb;
    if (sortMode === 'match') {
      sa = a.fit_score ?? -1; sb = b.fit_score ?? -1;
    } else if (sortMode === 'reply') {
      sa = a.reply_score ?? -1; sb = b.reply_score ?? -1;
    } else {
      sa = relevanceScore(a); sb = relevanceScore(b);
    }
    if (sb !== sa) return sb - sa;
    return (a.rent_chf || 0) - (b.rent_chf || 0);
  });

  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  document.getElementById('cards').innerHTML = '';
  document.getElementById('count').textContent = `${listings.length} listings`;

  listings.forEach(l => {
    const color = rentColor(l.rent_chf);
    const icon = L.divIcon({
      className: '',
      html: `<div style="background:${color};border:2px solid #fff;border-radius:3px;padding:1px 5px;font-family:'Courier New',monospace;font-size:11px;color:#111;font-weight:bold;white-space:nowrap;box-shadow:0 1px 3px #0008">${l.rent_chf}</div>`,
      iconAnchor: [0, 0]
    });

    const cmin = commuteMin(l);
    const clabel = commuteLabel(l);
    const linkHtml = l.url
      ? `<a href="${l.url}" target="_blank" class="popup-link">↗ view listing</a>`
      : '';

    const popup = L.popup({ closeButton: false }).setContent(`
      <div class="popup-rent">${l.rent_chf} CHF</div>
      <div>${l.title}</div>
      <div style="color:#666;font-size:0.7rem">${l.address}</div>
      <div class="popup-commute">${clabel}</div>
      ${linkHtml}
    `);

    const m = L.marker([l.lat, l.lng], { icon }).addTo(map).bindPopup(popup);
    m.on('click', () => selectListing(l.id));
    markers[l.id] = m;

    // card
    const card = document.createElement('div');
    card.className = 'card';
    card.id = `card-${l.id}`;
    card.innerHTML = `
      <div><span class="card-rent">${l.rent_chf} CHF</span>${scoreChip(l.fit_score)}${replyChip(l.reply_score)}</div>
      <div class="card-title">${l.title}</div>
      <div class="card-address">${l.address}</div>
      ${clabel ? `<div class="card-commute">${clabel}</div>` : ''}
      <div class="card-meta">
        <span>from ${l.available_from}</span>
        ${l.url ? `<a href="${l.url}" target="_blank" class="card-link" onclick="event.stopPropagation()">↗ listing</a>` : ''}
      </div>
    `;
    card.onclick = () => selectListing(l.id);
    document.getElementById('cards').appendChild(card);
  });
}

function selectListing(id) {
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  const card = document.getElementById(`card-${id}`);
  if (card) { card.classList.add('selected'); card.scrollIntoView({ block: 'nearest' }); }
  const l = allListings.find(x => x.id === id);
  if (l) {
    map.setView([l.lat, l.lng], 15);
    markers[id]?.openPopup();
    showDetail(l);
  }
}

function showDetail(l) {
  const ext = l.extracted || {};

  // link
  const link = document.getElementById('detail-ext-link');
  if (l.url) { link.href = l.url; link.style.display = ''; }
  else link.style.display = 'none';

  // build vibe pills
  const vibePills = (ext.vibe || []).map(v => `<span class="pill">${v}</span>`).join('');
  const reqPills  = (ext.hard_requirements || []).map(r => `<span class="pill red">${r}</span>`).join('');
  const prefBullets = (ext.preferences || []).map(p => `<div class="detail-bullet">${p}</div>`).join('');
  const includeBullets = (ext.asks_applicant_to_include || []).map(i => `<div class="detail-bullet">${i}</div>`).join('');
  const flagPills = (ext.red_flags || []).map(f => `<span class="pill red">${f}</span>`).join('');

  const clabel = commuteLabel(l);
  const householdStr = ext.household_size ? `${ext.household_size}-person flat` : '';
  const langStr = ext.language === 'de' ? 'German ad' : ext.language === 'en' ? 'English ad' : '';
  const durationStr = ext.duration === 'permanent' ? 'permanent' : ext.duration === 'fixed_term' ? 'fixed term' : ext.duration === 'sublet' ? 'sublet' : '';
  const posterStr = ext.poster_type === 'private' ? 'private person' : ext.poster_type === 'agency' ? 'agency/company' : '';

  document.getElementById('detail-body').innerHTML = `
    <div class="detail-rent">${l.rent_chf} CHF</div>
    <div class="detail-title">${l.title}</div>
    <div class="detail-addr">${l.address}</div>
    ${clabel ? `<div class="detail-commute">${clabel}</div>` : ''}
    <div class="detail-scores">${scoreChip(l.fit_score)}${replyChip(l.reply_score)}</div>
    <div class="detail-section">
      <div class="detail-section-label">Available</div>
      <div style="font-size:0.75rem;color:#ccc">${l.available_from}${durationStr ? ' · ' + durationStr : ''}</div>
    </div>
    ${vibePills || householdStr || langStr ? `
    <div class="detail-section">
      <div class="detail-section-label">Vibe</div>
      ${householdStr ? `<span class="pill green">${householdStr}</span>` : ''}
      ${langStr ? `<span class="pill green">${langStr}</span>` : ''}
      ${posterStr === 'private person' ? `<span class="pill green">private person</span>` : posterStr === 'agency/company' ? `<span class="pill red">agency/company</span>` : ''}
      ${vibePills}
    </div>` : ''}
    ${reqPills ? `
    <div class="detail-section">
      <div class="detail-section-label">Hard Requirements</div>
      ${reqPills}
    </div>` : ''}
    ${prefBullets ? `
    <div class="detail-section">
      <div class="detail-section-label">Preferences</div>
      ${prefBullets}
    </div>` : ''}
    ${includeBullets ? `
    <div class="detail-section">
      <div class="detail-section-label">Include in Your Message</div>
      ${includeBullets}
    </div>` : ''}
    ${flagPills ? `
    <div class="detail-section">
      <div class="detail-section-label">Red Flags</div>
      ${flagPills}
    </div>` : ''}
    ${!ext.vibe && !ext.hard_requirements ? `
    <div class="detail-section">
      <div style="font-size:0.65rem;color:#444;padding-top:8px">Run Extract to see ad details</div>
    </div>` : ''}
    ${l.url ? `<a class="detail-link-btn" href="${l.url}" target="_blank">↗ View Listing</a>` : ''}
  `;

  document.getElementById('cards-view').style.display = 'none';
  document.getElementById('detail-view').classList.add('open');
}

function closeDetail() {
  document.getElementById('detail-view').classList.remove('open');
  document.getElementById('cards-view').style.display = '';
}

function applyFilters() {
  const maxRent    = parseInt(document.getElementById('maxRent').value);
  const maxCommute = parseInt(document.getElementById('maxCommute').value);

  document.getElementById('rentLabel').textContent    = `${maxRent} CHF`;
  document.getElementById('commuteLabel').textContent = maxCommute >= 60 ? 'any' : `${maxCommute} min`;

  const filterCommute = maxCommute < 60;
  renderAll(allListings.filter(l => {
    if (l.rent_chf > maxRent) return false;
    if (filterCommute && commuteMin(l) > maxCommute) return false;
    if (posterFilter !== 'all') {
      const pt = l.extracted?.poster_type ?? null;
      if (posterFilter === 'private' && pt === 'agency') return false;
      if (posterFilter === 'agency'  && pt !== 'agency') return false;
    }
    return true;
  }));
}

document.getElementById('maxRent').addEventListener('input', applyFilters);
document.getElementById('maxCommute').addEventListener('input', applyFilters);

fetch('/listings')
  .then(r => r.json())
  .then(data => { allListings = data; applyFilters(); })
  .catch(e => console.error('Failed to load listings:', e));

// ── Profile panel ────────────────────────────────────────────────────────────
let _profile = {};

function openProfile() {
  fetch('/profile').then(r => r.json()).then(p => {
    _profile = p;
    document.getElementById('p-status').value      = p.status || '';
    document.getElementById('p-move-in').value     = p.move_in_earliest || '';
    document.getElementById('p-budget-max').value  = p.budget_chf?.max || '';
    document.getElementById('p-age').value         = p.age || '';
    document.getElementById('p-gender').value      = p.gender || '';
    document.getElementById('p-smoker').value      = p.smoker === true ? 'no' : p.smoker === false ? 'no' : '';
    document.getElementById('p-languages').value   = (p.languages || []).map(l => `${l.lang} ${l.level}`).join('\n');
    document.getElementById('p-traits').value      = (p.traits || []).join('\n');
    document.getElementById('p-wants').value       = (p.wants || []).join('\n');
    document.getElementById('p-template').value    = p.message_template || '';
  });
  document.getElementById('profile-panel').classList.add('open');
}

function closeProfile() {
  document.getElementById('profile-panel').classList.remove('open');
}

function saveProfile() {
  const langLines = document.getElementById('p-languages').value.trim().split('\n').filter(Boolean);
  const languages = langLines.map(line => {
    const parts = line.trim().split(/\s+/);
    const level = parts.pop();
    return { lang: parts.join(' '), level };
  });

  const updated = {
    ..._profile,
    status:          document.getElementById('p-status').value.trim(),
    move_in_earliest: document.getElementById('p-move-in').value,
    budget_chf:      { min: 0, max: parseInt(document.getElementById('p-budget-max').value) || 1000 },
    age:             parseInt(document.getElementById('p-age').value) || null,
    gender:          document.getElementById('p-gender').value.trim(),
    smoker:          document.getElementById('p-smoker').value.trim().toLowerCase() === 'yes',
    languages,
    traits:            document.getElementById('p-traits').value.trim().split('\n').filter(Boolean),
    wants:             document.getElementById('p-wants').value.trim().split('\n').filter(Boolean),
    message_template:  document.getElementById('p-template').value.trim(),
  };

  fetch('/profile', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(updated) })
    .then(r => r.json())
    .then(() => {
      document.getElementById('saved-msg').style.display = 'inline';
      setTimeout(() => document.getElementById('saved-msg').style.display = 'none', 2000);
      // reload listings with updated scores
      fetch('/listings').then(r => r.json()).then(data => { allListings = data; applyFilters(); });
    });
}

// ── Best listings modal ──────────────────────────────────────────────────────
function showBest() {
  const modal = document.getElementById('best-modal');
  const list  = document.getElementById('best-list');
  modal.classList.add('open');
  list.innerHTML = '<div id="best-loading">Analyzing top listings with AI…</div>';

  fetch('/best')
    .then(r => r.json())
    .then(listings => {
      if (!listings.length) {
        list.innerHTML = '<div id="best-loading">No eligible listings yet — run Extract first.</div>';
        return;
      }
      list.innerHTML = listings.map(l => {
        const a = l.analysis || {};
        const strengths = (a.strengths || []).map(s => `<div class="best-strength">${s}</div>`).join('');
        const weaknesses = (a.weaknesses || []).map(w => `<div class="best-weakness">${w}</div>`).join('');
        const tip = a.tip ? `<div class="best-tip">${a.tip}</div>` : '';
        const clabel = commuteLabel(l);
        return `
          <div class="best-entry">
            <div class="best-entry-top">
              <span class="best-entry-rent">${l.rent_chf} CHF</span>
              <span>${scoreChip(l.fit_score)}${replyChip(l.reply_score)}</span>
            </div>
            <div class="best-entry-title">${l.title}</div>
            <div style="font-size:0.62rem;color:#555;margin:1px 0">${l.address}</div>
            ${clabel ? `<div style="font-size:0.65rem;color:#4a9;margin:2px 0">${clabel}</div>` : ''}
            ${strengths || weaknesses ? `
            <div class="best-sw">
              ${strengths ? `<div class="best-col"><div class="best-col-label">Strengths</div>${strengths}</div>` : ''}
              ${weaknesses ? `<div class="best-col"><div class="best-col-label">Weaknesses</div>${weaknesses}</div>` : ''}
            </div>` : ''}
            ${tip}
            <div style="margin-top:6px;display:flex;justify-content:space-between;align-items:center">
              <span style="font-size:0.6rem;color:#444">from ${l.available_from}</span>
              ${l.url ? `<a class="best-open" href="${l.url}" target="_blank">↗ open listing</a>` : ''}
            </div>
          </div>`;
      }).join('');
    })
    .catch(() => {
      list.innerHTML = '<div id="best-loading">Failed to load — is the server running?</div>';
    });
}

function closeBest() {
  document.getElementById('best-modal').classList.remove('open');
}

// close modal on backdrop click
document.getElementById('best-modal').addEventListener('click', e => {
  if (e.target === document.getElementById('best-modal')) closeBest();
});

// ── Extraction trigger ───────────────────────────────────────────────────────
function runExtract() {
  const btn = document.getElementById('extract-btn');
  btn.textContent = 'Extracting…';
  btn.disabled = true;
  fetch('/extract', { method: 'POST' })
    .then(r => r.json())
    .then(d => {
      btn.textContent = `Extract (${d.extracted}/${d.total})`;
      btn.disabled = false;
      fetch('/listings').then(r => r.json()).then(data => { allListings = data; applyFilters(); });
    })
    .catch(() => { btn.textContent = 'Extract'; btn.disabled = false; });
}
</script>
